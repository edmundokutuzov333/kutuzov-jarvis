name: JARVIS quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck, lint, unit, build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install pinned npm CLI
        run: npm install --global npm@11.21.1

      - name: Synchronize lockfile with package manifest
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Commit an updated npm lockfile on main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: sync npm dependency lockfile"
            git push
          fi

      - name: Preserve npm lockfile as a build artifact
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
